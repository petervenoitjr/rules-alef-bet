const PSALM119 = [{"glyph": "א", "heading": "ALEPH", "headingAlt": "", "from": 1, "to": 8, "all8": true, "firstWord": "אַשְׁרֵי", "strongs": "H835", "kjv": "Blessed are the undefiled in the way, who walk in the law of the LORD."}, {"glyph": "ב", "heading": "BETH", "headingAlt": "", "from": 9, "to": 16, "all8": true, "firstWord": "בַּמֶּה", "strongs": "H4100", "kjv": "Wherewithal shall a young man cleanse his way? by taking heed thereto according to thy word."}, {"glyph": "ג", "heading": "GIMEL", "headingAlt": "", "from": 17, "to": 24, "all8": true, "firstWord": "גְּמֹל", "strongs": "H1580", "kjv": "Deal bountifully with thy servant, that I may live, and keep thy word."}, {"glyph": "ד", "heading": "DALETH", "headingAlt": "", "from": 25, "to": 32, "all8": true, "firstWord": "דָּבְקָה", "strongs": "H1692", "kjv": "My soul cleaveth unto the dust: quicken thou me according to thy word."}, {"glyph": "ה", "heading": "HE", "headingAlt": "", "from": 33, "to": 40, "all8": true, "firstWord": "הוֹרֵנִי", "strongs": "H3384", "kjv": "Teach me, O LORD, the way of thy statutes; and I shall keep it unto the end."}, {"glyph": "ו", "heading": "VAU", "headingAlt": "", "from": 41, "to": 48, "all8": true, "firstWord": "וִיבֹאֻנִי", "strongs": "H935", "kjv": "Let thy mercies come also unto me, O LORD, even thy salvation, according to thy word."}, {"glyph": "ז", "heading": "ZAIN", "headingAlt": "", "from": 49, "to": 56, "all8": true, "firstWord": "זְכֹר", "strongs": "H2142", "kjv": "Remember the word unto thy servant, upon which thou hast caused me to hope."}, {"glyph": "ח", "heading": "CHETH", "headingAlt": "", "from": 57, "to": 64, "all8": true, "firstWord": "חֶלְקִי", "strongs": "H2506", "kjv": "Thou art my portion, O LORD: I have said that I would keep thy words."}, {"glyph": "ט", "heading": "TETH", "headingAlt": "", "from": 65, "to": 72, "all8": true, "firstWord": "טוֹב", "strongs": "H2896", "kjv": "Thou hast dealt well with thy servant, O LORD, according unto thy word."}, {"glyph": " // ============================================================
// DOT-UI style  --  drop-in HUD + menu kit for p5.js 2.3.4
// Lifted from ALL HUMANS ARE DEAD Prototype 11 (v7_vis_base.js + v7_ui.js),
// with the game-only parts taken out so any sketch can use it.
// Paste this whole block into sketch.js (above setup) or load it as its own file.
// Needs: a canvas (any size). Uses width/height, so it works at any resolution.
// Call DUI.frame() at the top of draw(), DUI.tap(x, y) from touchStarted/mousePressed,
// and image(DUI.fx(), 0, 0, width, height) as the very last thing in draw().
// ============================================================

// ---------- palette (never invent new colors; use these) ----------
const TR = {
  cy: '#19E3FF',   // cyan     : default UI line, PLEX speaker, normal state
  cy2: '#8CF6FF',  // pale cyan: titles, headings, secondary labels
  mg: '#FF3FD0',   // magenta  : emergency / danger-to-do / terminals / last menu item
  am: '#FFB938',   // amber    : selected, interact, money, ABB speaker, "do this now"
  gn: '#3CFFB0',   // green    : online, done, fixed, boost ready
  vi: '#8E7BFF',   // violet   : secondary actions (switch, restart, customize)
  red: '#FF4D5E',  // red      : low power, boss, keys, failure
  bg: '#03060f'    // near-black blue background
};
const TR_OFF = '#58698f';         // disabled / off button color
const TR_DIM = '#41557a';         // locked / unknown
const TR_TXT = 'rgba(190,230,255,0.85)';   // body text on dark
const TR_SUB = 'rgba(160,200,230,0.7)';    // small stats / footnotes
const TR_GOLD = '#FFE9B0';        // big money numbers
const HUDFONT = '"Exo 2", Rajdhani, "Segoe UI", "Helvetica Neue", Arial, sans-serif';

// ---------- low-level helpers ----------
function glow(c, b) { drawingContext.shadowColor = c; drawingContext.shadowBlur = b; }
function noGlow() { drawingContext.shadowBlur = 0; drawingContext.shadowColor = 'rgba(0,0,0,0)'; }
function lspace(px) { try { drawingContext.letterSpacing = px + 'px'; } catch (_) {} }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function hex7(c) { return (typeof c === 'string' && c.length === 7 && c[0] === '#') ? c : TR.cy; }   // rgba() needs #rrggbb

function chamfer(x, y, w, h, c, g) {        // the signature shape: a rectangle with 45-degree cut corners
  const G = g || window; G.beginShape();
  G.vertex(x + c, y); G.vertex(x + w - c, y); G.vertex(x + w, y + c); G.vertex(x + w, y + h - c);
  G.vertex(x + w - c, y + h); G.vertex(x + c, y + h); G.vertex(x, y + h - c); G.vertex(x, y + c); G.endShape(CLOSE);
}
function hexagon(cx, cy, r, rot, g) {       // rot = HALF_PI gives a flat-sided (pointy-top) hex, used for buttons
  const G = g || window; G.beginShape();
  for (let i = 0; i < 6; i++) { const a = rot + i * Math.PI / 3; G.vertex(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  G.endShape(CLOSE);
}
function corners(x, y, w, h, l) {           // four corner brackets (call with stroke set)
  line(x, y + l, x, y); line(x, y, x + l, y); line(x + w - l, y, x + w, y); line(x + w, y, x + w, y + l);
  line(x + w, y + h - l, x + w, y + h); line(x + w, y + h, x + w - l, y + h); line(x + l, y + h, x, y + h); line(x, y + h, x, y + h - l);
}

// ---------- text ----------
function setFont(sz, wt) { textFont(HUDFONT); textSize(sz); try { textWeight(wt || 300); } catch (_) {} }
// txt(string, x, y, size, color, align, weight, letterSpacing) -- the only way text is drawn in this style
function txt(str, x, y, size, col, al, wt, ls) { setFont(size, wt); lspace(ls || 0); fill(col); noStroke(); textAlign(al || LEFT, CENTER); text(str, x, y); lspace(0); }
function wrapTxt(str, x, y, w, size, col, lead, al, wt) {   // word wrap inside width w; returns y after last line
  setFont(size, wt || 300); const words = String(str).split(' '); let ln = '', yy = y; fill(col); noStroke(); textAlign(al || LEFT, TOP);
  const ax = al === CENTER ? x + w / 2 : al === RIGHT ? x + w : x;
  for (const wd of words) { const t = ln ? ln + ' ' + wd : wd; if (textWidth(t) > w && ln) { text(ln, ax, yy); yy += lead; ln = wd; } else ln = t; }
  if (ln) { text(ln, ax, yy); yy += lead; } return yy;
}

// ---------- tap targets (rebuilt every frame) ----------
const DUI = { list: [], prev: [], t: 0, fxG: null, fxW: 0, fxH: 0, toast: { text: '', t: 0 }, banner: { text: '', t: 0, kicker: 'SECTOR' } };
DUI.frame = function () { DUI.prev = DUI.list; DUI.list = []; DUI.t += (deltaTime || 16) / 1000; if (DUI.toast.t > 0) DUI.toast.t -= deltaTime / 1000; if (DUI.banner.t > 0) DUI.banner.t -= deltaTime / 1000; };
DUI.tap = function (x, y) {                 // returns true if a button took the tap
  for (let i = DUI.prev.length - 1; i >= 0; i--) { const b = DUI.prev[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return true; } }
  return false;
};
DUI.say = function (text, secs) { DUI.toast.text = text; DUI.toast.t = secs || 3; };            // 'PLEX: ...' / 'ABB: ...'
DUI.sector = function (text, kicker) { DUI.banner.text = text; DUI.banner.t = 3.2; DUI.banner.kicker = kicker || 'SECTOR'; };

// ---------- menu button: chamfered, thin line, spaced caps ----------
// o: { col, hot (selected), alpha, size (15), wt (300), ls (letter spacing 4), c (chamfer 9) }
function uiBtn(x, y, w, h, label, fn, o = {}) {
  const col = o.col || TR.cy, a = o.alpha === undefined ? 1 : o.alpha, hot = o.hot;
  drawingContext.globalAlpha = a;
  stroke(col); strokeWeight(hot ? 2 : 1.2); fill(hot ? rgba(hex7(col), 0.18) : 'rgba(3,10,30,0.55)'); chamfer(x, y, w, h, o.c || 9);
  noStroke(); fill(col); setFont(o.size || 15, o.wt || 300); lspace(o.ls === undefined ? 4 : o.ls); textAlign(CENTER, CENTER);
  text(label, x + w / 2 + (o.ls === 0 ? 0 : 2), y + h / 2); lspace(0);   // +2 nudges spaced caps back to visual centre
  drawingContext.globalAlpha = 1; if (fn) DUI.list.push({ x, y, w, h, fn });
}

// ---------- round action button (thumb button): hexagon with drop shadow, inner hex, optional cooldown ring ----------
// b: { x, y, r }  ring: 0..1 cooldown fill (1 = ready, no ring drawn)
function hexBtn(b, label, col, ts = 12, pulse = false, ring = 1, fn) {
  const r = b.r * (pulse ? 1 + Math.sin(DUI.t * 6) * 0.05 : 1), c3 = hex7(col);
  noStroke(); fill(0, 0, 0, 70); hexagon(b.x, b.y + 3, r + 1, HALF_PI);

// ---------- p5 ----------
function loadFonts() {
  if (document.getElementById('alef-fonts')) { return; }
  const l = document.createElement('link'); l.id = 'alef-fonts'; l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400;500&family=Frank+Ruhl+Libre:wght@400;500&family=Noto+Serif+Hebrew:wght@400;500&display=swap';
  document.head.appendChild(l);
}
function fitCanvas() { const k = Math.min(window.innerWidth / width, window.innerHeight / height); cnv.elt.style.width = (width * k) + 'px'; cnv.elt.style.height = (height * k) + 'px'; }
function onPointerDown(e) {
  e.preventDefault(); sndInit(); try { window.focus(); } catch (_) {}
  const r = cnv.elt.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * width, y = (e.clientY - r.top) / r.height * height;
  handleTap(x, y);
}
function handleTap(x, y) {
  if (DUI.tap(x, y)) { SFX.ui(); return; }
  if (scene === 'play' && !paused) { const t = tileAt(x, y); if (t) { tapTile(t); } }
}
function onKeyDown(e) {
  sndInit();
  if (e.key === 'Escape') {
    if (scene === 'play' && G && G.clearT < 0) { paused = !paused; }
    else if (scene === 'howto') { goScene(howtoBack); } else if (scene === 'book') { goScene(bookBack); } else if (scene === 'card') { goScene(cardBack); } else if (scene === 'debug' || scene === 'announce') { goScene('title'); }
  } else if (e.key === 'Enter' || e.key === ' ') {
    if (scene === 'announce') { beginPlay(); } else if (scene === 'clear') { nextLevel(); }
    e.preventDefault();
  } else if (scene === 'card' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { bookIdx = (bookIdx + (e.key === 'ArrowRight' ? 1 : 21)) % 22;
  } else if ((e.key === 'h' || e.key === 'H') && scene === 'play' && !paused && G.mode === 'timeless') { showHint(true); }
}
function setup() {
  cnv = createCanvas(DISPLAY_W, DISPLAY_H);
  loadFonts();
  document.body.style.margin = '0'; document.body.style.background = TR.bg; document.body.style.overflow = 'hidden';
  document.body.style.display = 'flex'; document.body.style.alignItems = 'center'; document.body.style.justifyContent = 'center'; document.body.style.height = '100%'; document.documentElement.style.height = '100%';
  cnv.elt.style.touchAction = 'none';
  fitCanvas(); window.addEventListener('resize', fitCanvas);
  cnv.elt.addEventListener('pointerdown', onPointerDown, { passive: false });
  cnv.elt.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', onKeyDown);
  dotRig = new DotRig(); titleRig = new DotRig();
  loadAll();
  AhadFeel.config({ glitch: OPT.glitch, impact: false });
  AhadFeel.hooks.onStep = (n) => SFX.good(n);
  AhadFeel.hooks.onTier = () => { if (G) { setFace('heart', 1.2); } };
  AhadFeel.hooks.onBonus = (extra) => { if (G) { G.score += extra * PLAYER_POINTS_COMBO_BONUS; } };
}
function draw() {
  const dt = Math.min(0.05, (deltaTime || 16) / 1000);
  DUI.frame(); sceneT += dt; AhadFeel.update(dt);
  if (scene === 'title') { drawTitle(dt); }
  else if (scene === 'howto') { drawHowto(); }
  else if (scene === 'debug') { drawDebug(); }
  else if (scene === 'book') { drawBook(); }
  else if (scene === 'card') { drawCard(); }
  else if (scene === 'announce') { drawAnnounce(dt); }
  else if (scene === 'over') { drawOver(dt); }
  else if (scene === 'win') { drawWin(dt); }
  else {
    if (scene === 'play' && !paused && !AhadFeel.frozen()) { updatePlay(dt); }
    drawGame(dt);
    if (scene === 'clear') { drawClear(); }
    if (paused && scene === 'play') { drawPause(); }
  }
  if (scene === 'play' || scene === 'clear') { AhadFeel.drawGreatJob(width / 2, 150); }       // above the BOARD CLEAR card, never on top of its numbers
  AhadFeel.applyPostFx();
  image(DUI.fx(), 0, 0, width, height);
}

// ---------- test hooks (used by the automated checks; harmless in play) ----------
window.ALEF = {
  get scene() { return scene; }, get G() { return G; }, get paused() { return paused; },
  start(mode, level) { newGame(mode || 'timeless', level || 1); }, begin() { beginPlay(); },
  tapValid() { const v = validTiles(); if (v.length) { tapTile(v[0]); return true; } return false; },
  tapWrong() { const v = validTiles(), w = aliveTiles().find((t) => !v.includes(t)); if (w) { tapTile(w); return true; } return false; },
  tapAt(x, y) { handleTap(x, y); }, next() { nextLevel(); }, go(s) { goScene(s); }, pause(p) { paused = p; },
  card(i, back) { openCard(i, back || 'book'); }, book() { bookBack = 'title'; goScene('book'); }, met: MET, facts: FACTS,
  rule: (r, t) => ruleMatch(r, t), board: (lv) => { const info = levelInfo(lv), b = makeBoard(info.rules); return scoreBoard(b, info.rules); }
};
